  function lvStyle(k) { return "--c:var(" + lvMeta(k).v + ")"; }
  function coachLabel(c) { return COACH_LABELS[c] || c; }

  function sessionsActive() { return Object.keys(state.sessions).some(function (k) { return state.sessions[k]; }); }
  function matches(e) {
    if (!state.levels[e.level]) return false;
    if (state.coach && e.coaches.indexOf(state.coach) === -1) return false;
    if (sessionsActive() && !state.sessions[e.titleKey]) return false;
    return true;
  }

  /* ---------- filters UI ---------- */
  function renderLevelChips() {
    var counts = {};
    EVENTS.forEach(function (e) { counts[e.level] = (counts[e.level] || 0) + 1; });
    document.getElementById("lvchips").innerHTML = LEVELS.map(function (l) {
      return '<button class="lvchip" style="' + lvStyle(l.k) + '" data-lv="' + l.k + '" aria-pressed="' + !!state.levels[l.k] + '">' +
        l.label + ' <span class="n">' + (counts[l.k] || 0) + "</span></button>";
    }).join("");
  }
  document.getElementById("lvchips").addEventListener("click", function (ev) {
    var b = ev.target.closest(".lvchip"); if (!b) return;
    var k = b.dataset.lv;
    var allOn = LEVELS.every(function (l) { return state.levels[l.k]; });
    var onlyThis = state.levels[k] && LEVELS.every(function (l) { return l.k === k ? state.levels[l.k] : !state.levels[l.k]; });
    if (allOn) LEVELS.forEach(function (l) { state.levels[l.k] = l.k === k; });
    else if (onlyThis) LEVELS.forEach(function (l) { state.levels[l.k] = true; });
    else state.levels[k] = !state.levels[k];
    if (LEVELS.every(function (l) { return !state.levels[l.k]; })) LEVELS.forEach(function (l) { state.levels[l.k] = true; });
    renderAll();
  });

  var coachSel = document.getElementById("coachsel");
  function buildCoachOptions() {
    var counts = {};
    EVENTS.forEach(function (e) { e.coaches.forEach(function (c) { counts[c] = (counts[c] || 0) + 1; }); });
    var names = Object.keys(counts).sort(function (a, b) {
      var ga = (a === "CSM Team" || a === "Coaching team") ? 1 : 0;
      var gb = (b === "CSM Team" || b === "Coaching team") ? 1 : 0;
      return ga - gb || counts[b] - counts[a] || a.localeCompare(b);
    });
    var keep = state.coach;
    coachSel.innerHTML = '<option value="">All coaches</option>' + names.map(function (c) {
      return '<option value="' + esc(c) + '">' + esc(coachLabel(c)) + " (" + counts[c] + ")</option>";
    }).join("");
    coachSel.value = names.indexOf(keep) >= 0 ? keep : "";
    state.coach = coachSel.value;
  }
  coachSel.addEventListener("change", function () { state.coach = coachSel.value; renderAll(); });

  var sessBtn = document.getElementById("sessbtn"), sessPanel = document.getElementById("sesspanel");
  function buildSessionPanel() {
    var byTitle = {};
    EVENTS.forEach(function (e) { byTitle[e.titleKey] = byTitle[e.titleKey] || { t: e.title, n: 0 }; byTitle[e.titleKey].n++; });
    var keys = Object.keys(byTitle).sort(function (a, b) { return byTitle[b].n - byTitle[a].n || byTitle[a].t.localeCompare(byTitle[b].t); });
    var q = state.sessQuery.toLowerCase();
    sessPanel.innerHTML =
      '<input class="search" id="sessq" type="search" placeholder="Search sessions…" value="' + esc(state.sessQuery) + '">' +
      keys.filter(function (k) { return !q || k.indexOf(q) !== -1; }).map(function (k) {
        return '<label class="prow"><input type="checkbox" data-sk="' + esc(k) + '"' + (state.sessions[k] ? " checked" : "") + '>' +
          '<span class="lbl">' + esc(byTitle[k].t) + '</span><span class="pn">' + byTitle[k].n + "</span></label>";
      }).join("");
    var sq = document.getElementById("sessq");
    sq.addEventListener("input", function () { state.sessQuery = sq.value; var pos = sq.selectionStart; buildSessionPanel(); var nq = document.getElementById("sessq"); nq.focus(); nq.setSelectionRange(pos, pos); });
    syncSessBtn();
  }
  function syncSessBtn() {
    var sel = Object.keys(state.sessions).filter(function (k) { return state.sessions[k]; });
    sessBtn.innerHTML = (sel.length === 0 ? "All sessions" : sel.length === 1 ? "1 session selected" : sel.length + " sessions selected") + ' <span class="car">▼</span>';
  }
  sessPanel.addEventListener("change", function (ev) {
    var cb = ev.target.closest("[data-sk]"); if (!cb) return;
    state.sessions[cb.dataset.sk] = cb.checked;
    syncSessBtn(); renderAll();
  });
  sessBtn.addEventListener("click", function () {
    var open = sessPanel.hidden;
    sessPanel.hidden = !open;
    sessBtn.setAttribute("aria-expanded", String(open));
    if (open) { var sq = document.getElementById("sessq"); if (sq) sq.focus(); }
  });
  document.addEventListener("click", function (ev) {
    if (!sessPanel.hidden && !ev.target.closest(".fwrap")) { sessPanel.hidden = true; sessBtn.setAttribute("aria-expanded", "false"); }
  });
  document.getElementById("clearbtn").addEventListener("click", function () {
    LEVELS.forEach(function (l) { state.levels[l.k] = true; });
    state.coach = ""; coachSel.value = "";
    state.sessions = {}; state.sessQuery = "";
    buildSessionPanel(); renderAll();
  });

  /* ---------- shared toolbar ---------- */
  function mrow(title, prevDisabled, nextDisabled) {
    return '<div class="mrow">' +
      '<button class="navbtn" data-nav="prev" aria-label="Previous"' + (prevDisabled ? " disabled" : "") + ">‹</button>" +
      '<div class="mtitle">' + title + "</div>" +
      '<button class="navbtn" data-nav="next" aria-label="Next"' + (nextDisabled ? " disabled" : "") + ">›</button>" +
      '<button class="btn" data-nav="today">Today</button>' +
      '<span class="spacer"></span>' +
      '<div class="seg" role="group" aria-label="View">' +
        '<button data-view="month" aria-pressed="' + (state.view === "month") + '">Month</button>' +
        '<button data-view="week" aria-pressed="' + (state.view === "week") + '">Week</button>' +
      "</div></div>";
  }

  /* ---------- month view ---------- */
  function renderMonth() {
    var mm = MONTHS[state.mi] || { y: now.getFullYear(), m: now.getMonth() };
    var y = mm.y, m = mm.m;
    var first = new Date(y, m, 1);
    var lead = (first.getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var rows = Math.ceil((lead + dim) / 7);
    var cur = new Date(y, m, 1 - lead);
    var todayK = dayKey(now);

    var h = mrow(MNAMES[m] + " " + y, state.mi === 0, state.mi >= MONTHS.length - 1);
    h += '<div class="dow">' + ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function (d) { return "<div>" + d + "</div>"; }).join("") + "</div>";
    h += '<div class="cells">';
    for (var i = 0; i < rows * 7; i++) {
      var k = dayKey(cur);
      var evs = (byDay[k] || []).filter(matches);
      var cls = "cell";
      if (cur.getMonth() !== m) cls += " out";
      if (cur.getDay() === 0 || cur.getDay() === 6) cls += " we";
      if (k === todayK) cls += " today";
      else if (cur < now) cls += " past";
      h += '<div class="' + cls + '"><span class="dnum">' + cur.getDate() + "</span>";
      if (evs.length) {
        var MAX = 4;
        h += '<div class="chips">';
        evs.slice(0, MAX).forEach(function (e) {
          h += '<button class="chip" style="' + lvStyle(e.level) + '" data-uid="' + e.uid + '" title="' + esc(e.title) + '">' +
            '<span class="dot"></span><span class="tm">' + fmtTime.format(e.start) + '</span><span class="ct">' + esc(e.title) + "</span></button>";
        });
        h += "</div>";
        if (evs.length > MAX) h += '<button class="more" data-day="' + k + '">+' + (evs.length - MAX) + " more</button>";
      }
      h += "</div>";
      cur.setDate(cur.getDate() + 1);
    }
    h += "</div>";
    document.getElementById("main").innerHTML = h;
  }

  /* ---------- week view ---------- */
  function renderWeek() {
    var mon = state.wkMon;
    var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    var b = weekBounds();
    var title = fmtShort.format(mon) + " – " + fmtShort.format(sun) + " " + sun.getFullYear();
    var todayK = dayKey(now);

    var h = mrow(title, mon.getTime() <= b[0].getTime(), mon.getTime() >= b[1].getTime());
    h += '<div class="wkscroll"><div class="wkcols">';
    var wd = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    for (var i = 0; i < 7; i++) {
      var d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
      var k = dayKey(d);
      var evs = (byDay[k] || []).filter(matches);
      var cls = "wkcol";
      if (d.getDay() === 0 || d.getDay() === 6) cls += " we";
      if (k === todayK) cls += " today";
      else if (d < now) cls += " past";
      h += '<div class="' + cls + '"><div class="wkhead"><span class="wd">' + wd[i] + '</span><span class="dn">' + d.getDate() + "</span></div>";
      evs.forEach(function (e) {
        h += '<button class="wcard" style="' + lvStyle(e.level) + '" data-uid="' + e.uid + '" title="' + esc(e.title) + '">' +
          '<span class="tm"><span class="dot"></span>' + fmtTime.format(e.start) + '</span>' +
          '<span class="wt">' + esc(e.title) + "</span></button>";
      });
      h += "</div>";
    }
    h += "</div></div>";
    document.getElementById("main").innerHTML = h;
  }

  document.getElementById("main").addEventListener("click", function (ev) {
    var vw = ev.target.closest("[data-view]");
    if (vw) { state.view = vw.dataset.view; renderAll(); return; }
    var nav = ev.target.closest("[data-nav]");
    if (nav) {
      state.userNavigated = true;
      var dir = nav.dataset.nav;
      if (state.view === "month") {
        if (dir === "today") {
          var ti = MONTHS.findIndex(function (mm) { return mm.y === now.getFullYear() && mm.m === now.getMonth(); });
          state.mi = ti >= 0 ? ti : 0;
        } else state.mi = Math.max(0, Math.min(MONTHS.length - 1, state.mi + (dir === "next" ? 1 : -1)));
        renderMonth();
      } else {
        if (dir === "today") state.wkMon = clampWeek(monday(now));
        else state.wkMon = clampWeek(new Date(state.wkMon.getFullYear(), state.wkMon.getMonth(), state.wkMon.getDate() + (dir === "next" ? 7 : -7)));
        renderWeek();
      }
      return;
    }
    var chip = ev.target.closest("[data-uid]");
    if (chip) { state.fromDay = null; showEvent(chip.dataset.uid); return; }
    var more = ev.target.closest("[data-day]");
    if (more) showDay(more.dataset.day);
  });

  /* ---------- notice (connector info only) + count ---------- */
  var noticeEl = document.getElementById("notice");
  var connectorNote = "";
  function renderNotice() {
    noticeEl.hidden = !connectorNote;
    if (connectorNote) noticeEl.textContent = connectorNote;
  }
  function renderCount() {
    var n = EVENTS.filter(matches).length;
    document.getElementById("fcount").textContent = n + " of " + EVENTS.length + " sessions";
  }

  /* ---------- next-up lime pill ---------- */
  function renderNext() {
    var live = null, next = null;
    for (var i = 0; i < EVENTS.length; i++) {
      var e = EVENTS[i];
      if (e.start <= now && now < e.end && !live) live = e;
      if (e.start > now) { next = e; break; }
    }
    var lp = document.getElementById("livepill");
    var t = live || next;
    if (live) {
      lp.textContent = "LIVE · " + live.title.slice(0, 24) + (live.title.length > 24 ? "…" : "");
      lp.title = live.title;
    } else if (next) {
      var m = Math.round((next.start - now) / 60000);
      lp.textContent = m < 60 ? "Next in " + m + "m"
        : m < 1800 ? "Next in " + Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"
        : "Next · " + fmtShort.format(next.start);
      lp.title = next.title + " · " + fmtTime.format(next.start);
    } else {
      lp.textContent = "—"; lp.title = "No upcoming session in the loaded data";
    }
    lp.onclick = t ? function () { state.fromDay = null; showEvent(t.uid); } : null;
  }

  /* ---------- drawer ---------- */
  var drawer = document.getElementById("drawer"), backdrop = document.getElementById("backdrop"),
      dbody = document.getElementById("dbody"), dback = document.getElementById("dback");
  var lastFocus = null;
  function openDrawer() { drawer.classList.add("on"); backdrop.classList.add("on"); lastFocus = document.activeElement; document.getElementById("dclose").focus(); }
  function closeDrawer() { drawer.classList.remove("on"); backdrop.classList.remove("on"); state.sel = null; state.fromDay = null; if (lastFocus) lastFocus.focus(); }

  function showEvent(uid) {
    var e = byUid[uid]; if (!e) return;
    state.sel = uid;
    dback.hidden = !state.fromDay;
    var reps = seriesCount[e.titleKey] || 1;
    dbody.innerHTML =
      '<span class="lvpill" style="' + lvStyle(e.level) + '">' + lvMeta(e.level).label + "</span>" +
      '<h2 class="dtitle" id="dtitle">' + esc(e.title) + "</h2>" +
      '<div class="drow"><span class="d1">' + fmtLong.format(e.start) + "</span>" +
        '<span class="mono">' + fmtTime.format(e.start) + " – " + fmtTime.format(e.end) + " · " + e.dur + " min · your time (" + esc(tzName) + ")</span></div>" +
      '<div class="drow dcoach"><span>Coach</span>' + e.coaches.map(function (c) { return '<span class="coachchip">' + esc(coachLabel(c)) + "</span>"; }).join("") + "</div>" +
      '<div class="rsvps">' +
        '<div class="rsvp"><b>' + e.yes + "</b><span>going</span></div>" +
        '<div class="rsvp"><b>' + e.maybe + "</b><span>maybe</span></div>" +
        '<div class="rsvp"><b>' + e.no + "</b><span>can’t</span></div></div>" +
      (reps > 1 ? '<div class="dser">Recurring session · ' + reps + " times in the loaded range</div>" : '<div class="dser">Single session in the loaded range</div>') +
      '<a class="cta" href="' + esc(e.url) + '" target="_blank" rel="noopener">Open in GOAT Academy ↗</a>';
    openDrawer();
  }
  function showDay(k) {
    state.fromDay = k; state.sel = null; dback.hidden = true;
    var evs = (byDay[k] || []).filter(matches);
    var d = evs.length ? evs[0].start : now;
    dbody.innerHTML =
      '<h2 class="dtitle" id="dtitle">' + fmtLong.format(d) + "</h2>" +
      '<div class="dser">' + evs.length + " sessions</div>" +
      '<div class="daylist">' + evs.map(function (e) {
        return '<button class="agrow" style="' + lvStyle(e.level) + '" data-uid="' + e.uid + '">' +
          '<span class="dot"></span><span class="tm">' + fmtTime.format(e.start) + '</span><span class="ti">' + esc(e.title) + "</span></button>";
      }).join("") + "</div>";
    openDrawer();
  }
  dbody.addEventListener("click", function (ev) { var b = ev.target.closest("[data-uid]"); if (b) showEvent(b.dataset.uid); });
  dback.addEventListener("click", function () { if (state.fromDay) showDay(state.fromDay); });
  document.getElementById("dclose").addEventListener("click", closeDrawer);
  backdrop.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    if (drawer.classList.contains("on")) closeDrawer();
    else if (!sessPanel.hidden) { sessPanel.hidden = true; sessBtn.setAttribute("aria-expanded", "false"); }
  });

  /* ---------- theme toggle: follow system -> dark -> light ---------- */
  var themeBtn = document.getElementById("themebtn");
  var THEME_ICONS = {
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6M12 17v4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  };
  var themeMode = "system";
  try { themeMode = localStorage.getItem("ga-theme") || "system"; } catch (e) {}
  function applyTheme() {
    if (themeMode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", themeMode);
    themeBtn.innerHTML = THEME_ICONS[themeMode];
    themeBtn.title = "Theme: " + (themeMode === "system" ? "follow system" : themeMode);
    try { localStorage.setItem("ga-theme", themeMode); } catch (e) {}
  }
  themeBtn.addEventListener("click", function () {
    themeMode = themeMode === "system" ? "dark" : themeMode === "dark" ? "light" : "system";
    applyTheme();
  });
  applyTheme();

  /* ---------- data status ---------- */
  var dstate = document.getElementById("dstate"), dstateTxt = document.getElementById("dstatetxt");
  function setDataState(kind, text, detail) {
    dstate.classList.toggle("live", kind === "live");
    dstateTxt.textContent = text;
    connectorNote = "";
    dstate.onclick = detail ? function () { connectorNote = connectorNote ? "" : detail; renderNotice(); } : null;
    dstate.title = detail || "Data source";
    renderNotice();
    renderFoot();
  }
  function renderFoot() {
    var s = state.live
      ? "Live data from the community via the GOAT Academy connector" + (state.liveStamp ? " · updated " + fmtClock.format(new Date(state.liveStamp)) : "")
      : "Snapshot data generated " + (GA.meta.generatedAt ? fmtLong.format(new Date(GA.meta.generatedAt)) : GA.meta.fetchedAt) + " via the GOAT Academy MCP server";
    document.getElementById("footstamp").textContent = s + ".";
  }

  function renderAll() {
    renderLevelChips();
    state.view === "month" ? renderMonth() : renderWeek();
    renderNotice(); renderCount(); renderNext();
  }

  var tzName = "local";
  try { tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || "local"; } catch (e) {}
  document.getElementById("tzfoot").textContent = tzName;

  /* ---------- live layer (viewer's GOAT Academy connector) ---------- */
  var winData = {}, mergeTimer = null;
  function computeWindows() {
    var mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) - 7);
    var wins = [];
    for (var i = 0; i < 14; i++) {
      var a = new Date(Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate() + i * 3));
      var b = new Date(Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate() + i * 3 + 3));
      wins.push({ key: a.toISOString().slice(0, 10), startAt: a.toISOString(), endAt: b.toISOString(), from: a, to: b });
    }
    return wins;
  }
  function scheduleMerge() {
    if (mergeTimer) return;
    mergeTimer = setTimeout(function () {
      mergeTimer = null;
      var covered = [], liveRows = [];
      WINDOWS.forEach(function (w) {
        if (winData[w.key]) { covered.push(w); liveRows = liveRows.concat(winData[w.key]); }
      });
      if (!covered.length) return;
      var seen = {};
      liveRows = liveRows.filter(function (r) { var k = r.rid + "|" + r.start.getTime(); if (seen[k]) return false; seen[k] = true; return true; });
      var base = snapshotRows().filter(function (r) {
        return !covered.some(function (w) { return r.start >= w.from && r.start < w.to; });
      });
      state.live = true;
      setDataState("live", "LIVE · " + fmtClock.format(new Date(state.liveStamp || Date.now())), "Events are fetched live from the community with your GOAT Academy connector and refresh every 15 minutes while the page is open.");
      rebuild(base.concat(liveRows));
    }, 120);
  }
  var WINDOWS = computeWindows();
  function connectorFix(code) {
    if (code === "needs_reauth") return "Live updates paused — reconnect the GOAT Academy connector under claude.ai Settings → Connectors. Showing the latest snapshot meanwhile.";
    if (code === "server_not_connected" || code === "selection_required") return "This page can fetch events live: add (or choose) the GOAT Academy connector under claude.ai Settings → Connectors. Showing the latest daily snapshot meanwhile.";
    if (code === "not_in_manifest" || code === "blocked_by_policy" || code === "approval_required") return "Live fetching isn’t permitted for this viewer — showing the latest daily snapshot instead.";
    return "Live refresh is temporarily unavailable — showing the most recent data.";
  }
  function goLive() {
    if (!(window.claude && typeof window.claude.use === "function")) return;
    window.claude.use("mcp").then(function (mcp) {
      if (!mcp) return;
      mcp.listTools().then(function (lt) {
        var srv = (lt && lt.servers || []).find(function (s) { return s.tools && s.tools.length; });
        if (!srv) { setDataState("snapshot", "SNAPSHOT", connectorFix("server_not_connected")); return; }
        setDataState("loading", "CONNECTING…", null);
        WINDOWS.forEach(function (w) {
          mcp.watchTool(MCP_SERVER, "list_events",
            { spaceId: SPACE_GID, startAt: w.startAt, endAt: w.endAt, perPage: 50 },
            function (ev) {
              if (ev.type === "data") {
                var rows = normalizeLive(ev.result && ev.result.payload);
                if (rows) {
                  winData[w.key] = rows;
                  state.liveStamp = (ev.result.cache && ev.result.cache.storedAt) || Date.now();
                  scheduleMerge();
                }
              } else if (ev.type === "error") {
                var c = ev.error && ev.error.code;
                if (c === "needs_reauth" || c === "server_not_connected" || c === "selection_required" ||
                    c === "not_in_manifest" || c === "blocked_by_policy" || c === "approval_required") {
                  winData = {}; state.live = false;
                  setDataState("snapshot", "SNAPSHOT", connectorFix(c));
                  rebuild(snapshotRows());
                } else if (!state.live) {
                  setDataState("snapshot", "SNAPSHOT", connectorFix(c));
                }
              }
            },
            { cache: { staleTime: 120000, gcTime: 3600000 }, refetchInterval: 900000 });
        });
      }).catch(function () { /* keep snapshot */ });
    }).catch(function () { /* keep snapshot */ });
  }

  /* ---------- boot ---------- */
  setDataState("snapshot", "SNAPSHOT · " + (GA.meta.generatedAt ? fmtShort.format(new Date(GA.meta.generatedAt)) : GA.meta.fetchedAt),
    "Showing the latest saved snapshot. When opened with the GOAT Academy connector available, this page switches to live data automatically.");
  rebuild(snapshotRows());
  goLive();
  setInterval(function () { now = new Date(); renderNext(); }, 30000);
})();
</script>
