<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOAT Academy Live Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --page: #f6f9f8;
    --surface: #ffffff;
    --surface-2: #eef3f2;
    --wash: #f0f4f3;
    --ink: #10201d;
    --ink-2: #4d5f66;
    --ink-3: #7d8c92;
    --line: #e0e7e6;
    --line-2: #c4d0d2;
    --brand: #1b6fae;
    --brand-2: #15537e;
    --brand-ink: #ffffff;
    --brand-soft: #e3eef7;
    --lime: #c9e15c;
    --lime-ink: #253106;
    --grad: linear-gradient(100deg, #14443c 0%, #1c5a74 55%, #2e86c4 100%);
    --lv-beginner: #21a559;
    --lv-intermediate: #eda100;
    --lv-advanced: #7c3aed;
    --lv-all: #0d9fca;
    --shadow: 0 18px 48px rgba(13, 34, 30, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0f1213;
      --surface: #171b1d;
      --surface-2: #1e2426;
      --wash: #14181a;
      --ink: #e9eef0;
      --ink-2: #a6b3b9;
      --ink-3: #71808a;
      --line: #252c30;
      --line-2: #36414a;
      --brand: #4a9ede;
      --brand-2: #2e7cb8;
      --brand-ink: #071825;
      --brand-soft: #14293a;
      --lime: #c9e15c;
      --lime-ink: #1c2508;
      --grad: linear-gradient(100deg, #14443c 0%, #1c5a74 55%, #2e86c4 100%);
      --lv-beginner: #33a45c;
      --lv-intermediate: #c98500;
      --lv-advanced: #9d74f2;
      --lv-all: #189cbe;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0f1213;
    --surface: #171b1d;
    --surface-2: #1e2426;
    --wash: #14181a;
    --ink: #e9eef0;
    --ink-2: #a6b3b9;
    --ink-3: #71808a;
    --line: #252c30;
    --line-2: #36414a;
    --brand: #4a9ede;
    --brand-2: #2e7cb8;
    --brand-ink: #071825;
    --brand-soft: #14293a;
    --lime: #c9e15c;
    --lime-ink: #1c2508;
    --grad: linear-gradient(100deg, #14443c 0%, #1c5a74 55%, #2e86c4 100%);
    --lv-beginner: #33a45c;
    --lv-intermediate: #c98500;
    --lv-advanced: #9d74f2;
    --lv-all: #189cbe;
    --shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
  a { color: var(--brand); }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); }

  .gradbar { height: 42px; background: var(--grad); }
  .app { max-width: 1320px; margin: 0 auto; padding: 18px 22px 40px; }

  /* ---------- header ---------- */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { display: flex; gap: 14px; align-items: center; }
  .logotile {
    width: 46px; height: 46px; border-radius: 12px; background: var(--brand);
    display: grid; place-items: center; color: #fff; flex: none;
  }
  .logotile svg { width: 26px; height: 26px; }
  .apptitle {
    margin: 0;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-weight: 800; font-size: 26px; line-height: 1.04; letter-spacing: 0.005em;
    text-transform: uppercase; color: var(--brand);
  }
  .hright { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dstate {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-3);
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; letter-spacing: 0.04em;
    border: 1px dashed var(--line-2); border-radius: 999px;
  }
  .dstate .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dstate.live .dot { background: var(--lime); animation: pulse 2s ease-in-out infinite; }
  .dstate.live { color: var(--ink-2); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2);
    background: var(--surface); display: grid; place-items: center; color: var(--ink-2);
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--ink-3); }
  .iconbtn svg { width: 17px; height: 17px; }
  .limepill {
    background: var(--lime); color: var(--lime-ink);
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600;
    border-radius: 999px; padding: 8px 15px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .limepill:hover { filter: brightness(1.06); }

  /* ---------- filters ---------- */
  .filters {
    display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 16px 14px; margin-bottom: 14px;
  }
  .fgroup { display: flex; flex-direction: column; gap: 7px; }
  .fgroup > .eyebrow { color: var(--ink-3); }
  .lvchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .lvchip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1.5px solid var(--c); color: var(--c);
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    border-radius: 999px; padding: 5px 12px;
  }
  .lvchip .n { font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500; opacity: 0.85; }
  .lvchip[aria-pressed="true"] { background: var(--c); color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.28); }
  .lvchip[aria-pressed="false"] { opacity: 0.55; }
  .lvchip:hover { opacity: 1; }
  .fsel, .fbtn {
    border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
    border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 500; min-width: 170px; text-align: left;
  }
  select.fsel { appearance: auto; }
  .fbtn { display: inline-flex; justify-content: space-between; align-items: center; gap: 10px; }
  .fbtn .car { color: var(--ink-3); font-size: 10px; }
  .fwrap { position: relative; }
  .panel {
    position: absolute; z-index: 30; top: calc(100% + 6px); left: 0;
    width: 300px; max-height: 340px; overflow: auto;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px;
    box-shadow: var(--shadow); padding: 10px;
  }
  .panel .search {
    width: 100%; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; margin-bottom: 8px; font-family: inherit;
  }
  .prow { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 7px; border-radius: 7px; text-align: left; font-size: 12.5px; cursor: pointer; }
  .prow:hover { background: var(--surface-2); }
  .prow input { accent-color: var(--brand); margin: 0; }
  .prow .pn { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-3); margin-left: auto; }
  .prow .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fclear { color: var(--ink-3); font-size: 12.5px; font-weight: 600; padding: 8px 4px; }
  .fclear:hover { color: var(--brand); }
  .fcount { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-3); padding-bottom: 9px; font-variant-numeric: tabular-nums; }

  .notice {
    border: 1px solid var(--line); border-left: 3px solid var(--brand);
    background: var(--surface); color: var(--ink-2);
    border-radius: 10px; padding: 9px 14px; font-size: 12.5px; margin-bottom: 14px;
  }

  /* ---------- toolbar row (rendered per view) ---------- */
  .mrow { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .navbtn {
    width: 31px; height: 31px; border-radius: 8px; border: 1px solid var(--line-2);
    background: var(--surface); display: grid; place-items: center; font-size: 15px; color: var(--ink-2);
  }
  .navbtn:hover:not(:disabled) { color: var(--ink); }
  .navbtn:disabled { opacity: 0.3; cursor: default; }
  .mtitle { font-family: "Archivo", Arial, sans-serif; font-weight: 700; font-size: 19px; min-width: 180px; text-align: center; font-variant-numeric: tabular-nums; }
  .btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 5px 13px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .btn:hover { color: var(--ink); }
  .spacer { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .seg button { padding: 6px 15px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

  /* ---------- month view ---------- */
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; }
  .dow div { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 0 4px 2px; }
  .cells { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cell {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    min-height: 118px; padding: 6px 5px 5px; display: flex; flex-direction: column; gap: 4px; overflow: hidden;
  }
  .cell.we { background: var(--wash); }
  .cell.out { opacity: 0.45; }
  .cell.past .chip { opacity: 0.5; }
  .dnum { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 500; color: var(--ink-2); align-self: flex-start; padding: 1px 6px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .cell.today { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .cell.today .dnum { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .chips { display: flex; flex-direction: column; gap: 3px; }
  .chip {
    display: flex; align-items: center; gap: 5px; width: 100%;
    border-radius: 6px; padding: 2.5px 6px; text-align: left;
    background: color-mix(in srgb, var(--c) 13%, var(--surface));
    font-size: 11px; line-height: 1.35; color: var(--ink);
  }
  .chip:hover { background: color-mix(in srgb, var(--c) 27%, var(--surface)); }
  .chip .dot { width: 7px; height: 7px; border-radius: 2.5px; background: var(--c); flex: none; }
  .chip .tm { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-2); flex: none; font-variant-numeric: tabular-nums; }
  .chip .ct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .more { font-size: 10.5px; color: var(--ink-3); font-weight: 600; padding: 1px 6px; border-radius: 5px; align-self: flex-start; }
  .more:hover { color: var(--brand); background: var(--brand-soft); }

  /* ---------- week view ---------- */
  .wkscroll { overflow-x: auto; }
  .wkcols { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; min-width: 860px; }
  .wkcol {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    min-height: 300px; padding: 6px 5px; display: flex; flex-direction: column; gap: 4px;
  }
  .wkcol.we { background: var(--wash); }
  .wkcol.today { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .wkcol.past .wcard { opacity: 0.5; }
  .wkhead { display: flex; align-items: baseline; gap: 7px; padding: 2px 4px 5px; }
  .wkhead .wd { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .wkhead .dn { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: 999px; }
  .wkcol.today .wkhead .dn { background: var(--brand); color: var(--brand-ink); }
  .wcard {
    display: block; width: 100%; text-align: left; border-radius: 7px; padding: 4px 7px 5px;
    background: color-mix(in srgb, var(--c) 13%, var(--surface)); color: var(--ink);
  }
  .wcard:hover { background: color-mix(in srgb, var(--c) 27%, var(--surface)); }
  .wcard .tm { display: flex; align-items: center; gap: 5px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .wcard .tm .dot { width: 7px; height: 7px; border-radius: 2.5px; background: var(--c); flex: none; }
  .wcard .wt {
    font-size: 11.5px; font-weight: 500; line-height: 1.3; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ---------- drawer ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(5, 10, 12, 0.45); opacity: 0; pointer-events: none; transition: opacity 0.18s ease; z-index: 40; }
  .backdrop.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(432px, 100vw);
    background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
    transform: translateX(102%); transition: transform 0.22s ease; z-index: 50;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .drawer.on { transform: translateX(0); }
  .dhead { display: flex; align-items: center; gap: 8px; padding: 14px 18px 0; }
  .dhead .iconbtn { border-radius: 9px; width: 31px; height: 31px; }
  .dbody { padding: 12px 22px 26px; }
  .lvpill {
    display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.28);
    background: var(--c); border-radius: 999px; padding: 4px 12px; margin-bottom: 12px;
  }
  .dtitle { font-family: "Archivo", Arial, sans-serif; font-weight: 700; font-size: 21px; line-height: 1.18; margin: 0 0 12px; text-wrap: balance; }
  .drow { border-top: 1px solid var(--line); padding: 10px 0; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 3px; }
  .drow .d1 { color: var(--ink); font-weight: 600; }
  .drow .mono { font-size: 12.5px; }
  .dcoach { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .coachchip { background: var(--surface-2); border-radius: 999px; padding: 2px 11px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .rsvps { display: flex; gap: 7px; margin: 13px 0 4px; flex-wrap: wrap; }
  .rsvp { border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; text-align: center; min-width: 76px; }
  .rsvp b { display: block; font-family: "IBM Plex Mono", monospace; font-size: 16px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .rsvp span { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.07em; text-transform: uppercase; }
  .dser { font-size: 12.5px; color: var(--ink-3); margin: 9px 0 16px; }
  .cta { display: inline-block; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 14px; border-radius: 10px; padding: 10px 17px; text-decoration: none; }
  .cta:hover { filter: brightness(1.08); }
  .daylist { display: flex; flex-direction: column; gap: 5px; margin-top: 9px; }
  .agrow {
    display: flex; align-items: center; gap: 11px; text-align: left; width: 100%;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px;
  }
  .agrow:hover { border-color: var(--line-2); }
  .agrow .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none; }
  .agrow .tm { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-2); flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .agrow .ti { font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  footer { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 13px; font-size: 12px; color: var(--ink-3); display: grid; gap: 3px; }
  footer a { color: var(--ink-2); }

  @media (max-width: 760px) {
    .app { padding: 12px 10px 30px; }
    .gradbar { height: 32px; }
    .apptitle { font-size: 20px; }
    .cell { min-height: 84px; padding: 4px 3px 3px; }
    .chip .ct { display: none; }
    .chip { padding: 2px 4px; }
    .mtitle { min-width: 0; font-size: 16px; }
    .fcount { display: none; }
    .filters { gap: 12px; }
    .wkcols { min-width: 760px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dstate.live .dot { animation: none; }
    .drawer, .backdrop { transition: none; }
  }
</style>

<div class="gradbar"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logotile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2.5"/>
          <path d="M3 10h18M8 3v4M16 3v4"/>
          <path d="M8 14.5h3M8 17.5h6"/>
        </svg>
      </div>
      <h1 class="apptitle">Live Events<br>Calendar</h1>
    </div>
    <div class="hright">
      <button class="dstate" id="dstate" title="Data source"><span class="dot"></span><span id="dstatetxt">Loading…</span></button>
      <button class="iconbtn" id="themebtn" title="Theme: follow system" aria-label="Switch theme"></button>
      <button class="limepill" id="livepill" title="Next session">—</button>
    </div>
  </header>

  <div class="filters">
    <div class="fgroup">
      <span class="eyebrow">Level</span>
      <div class="lvchips" id="lvchips"></div>
    </div>
    <div class="fgroup">
      <span class="eyebrow">Coach</span>
      <select class="fsel" id="coachsel" aria-label="Filter by coach"></select>
    </div>
    <div class="fgroup fwrap">
      <span class="eyebrow">Session</span>
      <button class="fbtn" id="sessbtn" aria-haspopup="true" aria-expanded="false">All sessions <span class="car">▼</span></button>
      <div class="panel" id="sesspanel" hidden></div>
    </div>
    <button class="fclear" id="clearbtn">✕ Clear</button>
    <span class="fcount" id="fcount"></span>
  </div>

  <div class="notice" id="notice" hidden></div>

  <main id="main"></main>

  <footer>
    <span id="footstamp"></span>
    <span>Colours follow the Live Events Rubric from the Trading Roadmap. When the GOAT Academy connector is available, this page fetches events live; otherwise it shows the latest daily snapshot.</span>
    <span><a href="https://friends.goatacademy.org/spaces/16767656/events" target="_blank" rel="noopener">Open the space in GOAT Academy ↗</a> · times shown in <span class="mono" id="tzfoot"></span></span>
  </footer>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <div class="dhead">
    <button class="iconbtn" id="dback" aria-label="Back to day" hidden>‹</button>
    <div class="spacer"></div>
    <button class="iconbtn" id="dclose" aria-label="Close">✕</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<script id="ga-data" type="application/json">__GA_DATA__</script>
<script id="app">
(function () {
  "use strict";
  var GA = JSON.parse(document.getElementById("ga-data").textContent);
  var SPACE_GID = GA.meta.spaceGlobalId;
  var SPACE_RID = GA.meta.spaceResourceId;
  var MCP_SERVER = "Goat_Academy";

  var LEVELS = [
    { k: "beginner",     label: "Beginner",     v: "--lv-beginner" },
    { k: "intermediate", label: "Intermediate", v: "--lv-intermediate" },
    { k: "advanced",     label: "Advanced",     v: "--lv-advanced" },
    { k: "all",          label: "All levels",   v: "--lv-all" }
  ];

  // Level mapping from the Trading Roadmap's Live Events Rubric (2026 edition).
  // Sessions not in the rubric fall through to the heuristics at the end.
  var LEVEL_RULES = [
    [/market review|weekly recap|weekly round/, "all"],
    [/general market q&a|investing q&a|market psychology|topic of the week|friday investing/, "all"],
    [/mid.?week markets update|markets and investment discussion|economic outlook|preparing for the week|weekend wrap/, "all"],
    [/^\(wsp\)\s*q&a/, "all"],
    [/macro data|advanced/, "advanced"],
    [/broker|onboard|ssm|new students|platform/, "beginner"],

  var EVENTS = [], byUid = {}, byDay = {}, seriesCount = {}, MONTHS = [];

  function rebuild(rows) {

  /* ---------- month view ---------- */
  function renderMonth() {
    var mm = MONTHS[state.mi] || { y: now.getFullYear(), m: now.getMonth() };
    var y = mm.y, m = mm.m;
    var first = new Date(y, m, 1);
    var lead = (first.getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var rows = Math.ceil((lead + dim) / 7);
    var cur = new Date(y, m, 1 - lead);
    var todayK = dayKey(now);

    var h = mrow(MNAMES[m] + " " + y, state.mi === 0, state.mi >= MONTHS.length - 1);
    h += '<div class="dow">' + ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function (d) { return "<div>" + d + "</div>"; }).join("") + "</div>";
    h += '<div class="cells">';
    for (var i = 0; i < rows * 7; i++) {

      var cls = "cell";

      if (k === todayK) cls += " today";

  function applyTheme() {
    if (themeMode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", themeMode);
    themeBtn.innerHTML = THEME_ICONS[themeMode];
    themeBtn.title = "Theme: " + (themeMode === "system" ? "follow system" : themeMode);
    try { localStorage.setItem("ga-theme", themeMode); } catch (e) {}
  }
  themeBtn.addEventListener("click", function () {
    themeMode = themeMode === "system" ? "dark" : themeMode === "dark" ? "light" : "system";
    applyTheme();
  });
  applyTheme();

  /* ---------- data status ---------- */
  var dstate = document.getElementById("dstate"), dstateTxt = document.getElementById("dstatetxt");
  function setDataState(kind, text, detail) {
    dstate.classList.toggle("live", kind === "live");
    dstateTxt.textContent = text;
    connectorNote = "";
    dstate.onclick = detail ? function () { connectorNote = connectorNote ? "" : detail; renderNotice(); } : null;
    dstate.title = detail || "Data source";
    renderNotice();
    renderFoot();
  }
  function renderFoot() {
    var s = state.live
      ? "Live data from the community via the GOAT Academy connector" + (state.liveStamp ? " · updated " + fmtClock.format(new Date(state.liveStamp)) : "")
      : "Snapshot data generated " + (GA.meta.generatedAt ? fmtLong.format(new Date(GA.meta.generatedAt)) : GA.meta.fetchedAt) + " via the GOAT Academy MCP server";
    document.getElementById("footstamp").textContent = s + ".";
  }

  function renderAll() {
    renderLevelChips();
    state.view === "month" ? renderMonth() : renderWeek();
    renderNotice(); renderCount(); renderNext();
  }

  var tzName = "local";
  try { tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || "local"; } catch (e) {}
  document.getElementById("tzfoot").textContent = tzName;

  /* ---------- live layer (viewer's GOAT Academy connector) ---------- */
  var winData = {}, mergeTimer = null;
  function computeWindows() {
    var mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) - 7);
    var wins = [];
    for (var i = 0; i < 14; i++) {
      var a = new Date(Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate() + i * 3));
      var b = new Date(Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate() + i * 3 + 3));
      wins.push({ key: a.toISOString().slice(0, 10), startAt: a.toISOString(), endAt: b.toISOString(), from: a, to: b });
    }
    return wins;
  }
  function scheduleMerge() {
    if (mergeTimer) return;
    mergeTimer = setTimeout(function () {
      mergeTimer = null;
      var covered = [], liveRows = [];
      WINDOWS.forEach(function (w) {
        if (winData[w.key]) { covered.push(w); liveRows = liveRows.concat(winData[w.key]); }
      });
      if (!covered.length) return;
      var seen = {};
      liveRows = liveRows.filter(function (r) { var k = r.rid + "|" + r.start.getTime(); if (seen[k]) return false; seen[k] = true; return true; });
      var base = snapshotRows().filter(function (r) {
        return !covered.some(function (w) { return r.start >= w.from && r.start < w.to; });
      });
      state.live = true;
      setDataState("live", "LIVE · " + fmtClock.format(new Date(state.liveStamp || Date.now())), "Events are fetched live from the community with your GOAT Academy connector and refresh every 15 minutes while the page is open.");
      rebuild(base.concat(liveRows));
    }, 120);
  }
  var WINDOWS = computeWindows();
  function connectorFix(code) {
    if (code === "needs_reauth") return "Live updates paused — reconnect the GOAT Academy connector under claude.ai Settings → Connectors. Showing the latest snapshot meanwhile.";
    if (code === "server_not_connected" || code === "selection_required") return "This page can fetch events live: add (or choose) the GOAT Academy connector under claude.ai Settings → Connectors. Showing the latest daily snapshot meanwhile.";
    if (code === "not_in_manifest" || code === "blocked_by_policy" || code === "approval_required") return "Live fetching isn’t permitted for this viewer — showing the latest daily snapshot instead.";
    return "Live refresh is temporarily unavailable — showing the most recent data.";
  }
  function goLive() {
    if (!(window.claude && typeof window.claude.use === "function")) return;
    window.claude.use("mcp").then(function (mcp) {
      if (!mcp) return;
      mcp.listTools().then(function (lt) {
        var srv = (lt && lt.servers || []).find(function (s) { return s.tools && s.tools.length; });
        if (!srv) { setDataState("snapshot", "SNAPSHOT", connectorFix("server_not_connected")); return; }
        setDataState("loading", "CONNECTING…", null);
        WINDOWS.forEach(function (w) {
          mcp.watchTool(MCP_SERVER, "list_events",
            { spaceId: SPACE_GID, startAt: w.startAt, endAt: w.endAt, perPage: 50 },
            function (ev) {
              if (ev.type === "data") {
                var rows = normalizeLive(ev.result && ev.result.payload);
                if (rows) {
                  winData[w.key] = rows;
                  state.liveStamp = (ev.result.cache && ev.result.cache.storedAt) || Date.now();
                  scheduleMerge();
                }
              } else if (ev.type === "error") {
                var c = ev.error && ev.error.code;
                if (c === "needs_reauth" || c === "server_not_connected" || c === "selection_required" ||
                    c === "not_in_manifest" || c === "blocked_by_policy" || c === "approval_required") {
                  winData = {}; state.live = false;
                  setDataState("snapshot", "SNAPSHOT", connectorFix(c));
                  rebuild(snapshotRows());
                } else if (!state.live) {
                  setDataState("snapshot", "SNAPSHOT", connectorFix(c));
                }
              }
            },
            { cache: { staleTime: 120000, gcTime: 3600000 }, refetchInterval: 900000 });
        });
      }).catch(function () { /* keep snapshot */ });
    }).catch(function () { /* keep snapshot */ });
  }

  /* ---------- boot ---------- */
  setDataState("snapshot", "SNAPSHOT · " + (GA.meta.generatedAt ? fmtShort.format(new Date(GA.meta.generatedAt)) : GA.meta.fetchedAt),
    "Showing the latest saved snapshot. When opened with the GOAT Academy connector available, this page switches to live data automatically.");
  rebuild(snapshotRows());
  goLive();
  setInterval(function () { now = new Date(); renderNext(); }, 30000);
})();
</script>
</html>
